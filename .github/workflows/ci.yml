name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build JS bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jdm-bundle
          path: src/django_jdm_editor/static/django_jdm_editor/jdm-editor.*

  test:
    needs: build-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.1", "5.2"]
        exclude:
          - python-version: "3.10"
            django-version: "5.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: jdm-bundle
          path: src/django_jdm_editor/static/django_jdm_editor/
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0" pytest pytest-django
          pip install -e .
      - name: Test
        run: pytest -v

  package:
    needs: build-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Assert bundle is inside the wheel
        run: |
          unzip -l dist/*.whl | grep "django_jdm_editor/static/django_jdm_editor/jdm-editor.js"
          unzip -l dist/*.whl | grep "django_jdm_editor/static/django_jdm_editor/jdm-editor.css"
